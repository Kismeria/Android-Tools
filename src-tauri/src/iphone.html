<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Android Tools">
<meta name="theme-color" content="#000000">
<title>Android Tools · Camera</title>
<style>
  :root { --accent: #3ddc84; --text: #f2f2f2; --dim: #8c8c8c; --panel: rgba(20,20,20,.72); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font: 15px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  video.mirror { transform: scaleX(-1); }
  .top, .bottom { position: fixed; left: 0; right: 0; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .top { top: 0; padding-top: max(14px, env(safe-area-inset-top)); background: linear-gradient(#000c, #0000); }
  .bottom { bottom: 0; padding-bottom: max(18px, env(safe-area-inset-bottom)); flex-direction: column; background: linear-gradient(#0000, #000d); }
  .brand { font-weight: 600; }
  .pill { margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 16px; background: var(--panel); font-size: 13px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.live { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .row { display: flex; gap: 10px; width: 100%; }
  button { flex: 1; height: 50px; border: 0; border-radius: 14px; background: var(--panel); color: var(--text); font: inherit; font-weight: 600; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  button.primary { background: var(--accent); color: #000; }
  button.round { flex: none; width: 50px; font-size: 20px; }
  button:disabled { opacity: .4; }
  .hint { color: var(--dim); font-size: 12.5px; text-align: center; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; }
  .center .big { font-size: 20px; font-weight: 600; }
  .center button { flex: none; width: 240px; }
  .cover { background: rgba(0,0,0,.86); z-index: 5; }
  .stats { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div class="center" id="intro">
  <div style="font-size:48px">📷</div>
  <div class="big" data-t="intro">Камера для Android Tools</div>
  <div class="hint" id="introHint" data-t="introHint">Нажмите кнопку и разрешите доступ к камере. Картинка появится на ПК как «Android Tools Camera».</div>
</div>
<div class="center cover hidden" id="taken">
  <div class="big" data-t="taken">Камера открыта на другой странице</div>
  <div class="hint" data-t="takenHint">ПК работает с той страницей, которую открыли последней.</div>
  <button class="primary" id="retake" data-t="retake">Подключить здесь</button>
</div>
<div class="top">
  <span class="brand">Android Tools</span>
  <span class="pill"><span class="dot" id="dot"></span><span id="state">…</span></span>
</div>
<div class="bottom">
  <div class="stats" id="stats"></div>
  <div class="row">
    <button class="round" id="flip" title="Flip">⟲</button>
    <button class="primary" id="go" data-t="allow">Включить камеру</button>
    <button class="round" id="torch" title="Torch" disabled>⚡</button>
  </div>
  <div class="hint" data-t="keep">Не блокируйте экран. Кабель: включите «Режим модема» на iPhone.</div>
</div>
<script>
"use strict";
const EN = {
  intro: "Camera for Android Tools", introHint: "Tap the button and allow camera access. The picture appears on the PC as “Android Tools Camera”.",
  allow: "Start camera", stop: "Stop camera", keep: "Keep the screen on. USB cable: turn on Personal Hotspot on the iPhone.",
  offline: "No PC connection", waiting: "Connected · waiting for PC", live: "Streaming to PC", ready: "Camera ready",
  denied: "Camera access denied: Settings → Safari → Camera → Allow", busy: "The camera is used by another app",
  tap: "Tap “Start camera”", nocam: "This browser gives no camera access. Open the link in Safari.",
  taken: "The camera is open on another page", takenHint: "The PC works with the page opened last.", retake: "Connect here",
};
const RU = {
  stop: "Выключить камеру", offline: "Нет связи с ПК", waiting: "Подключено · ждём ПК", live: "Трансляция на ПК",
  ready: "Камера готова", denied: "Нет доступа к камере: Настройки → Safari → Камера → Разрешить",
  busy: "Камера занята другим приложением", tap: "Нажмите «Включить камеру»",
  nocam: "Браузер не даёт доступ к камере. Откройте ссылку в Safari.",
};
const en = !/^ru|^uk|^be|^kk/i.test(navigator.language || "");
const t = (k) => (en ? EN[k] : RU[k]) || k;
if (en) document.querySelectorAll("[data-t]").forEach((el) => { if (EN[el.dataset.t]) el.textContent = EN[el.dataset.t]; });

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
const token = new URLSearchParams(location.search).get("k") || "";
// This page's id: the PC talks to one page at a time, the one opened last.
const sid = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
const url = (path, extra = "") => `${path}?k=${encodeURIComponent(token)}&sid=${sid}${extra}`;
let stream = null, wanted = false, sending = false, online = false, replaced = false, hello = true, wake = null, inflight = 0;
let cfg = { facing: "front", width: 1280, height: 720, fps: 30, quality: 0.72, torch: false };
let frames = 0, bytes = 0, lastStat = performance.now();

function setState(text, kind) {
  $("state").textContent = text;
  $("dot").className = "dot " + (kind || "");
}
function paintState() {
  if (replaced) return;
  if (!online) setState(t("offline"));
  else if (sending) setState(t("live"), "live");
  else setState(stream ? t("ready") : t("waiting"), "ok");
}

// Plain same-origin requests: Safari trusts them once the certificate warning was accepted.
function post(path, body, type) {
  return fetch(url(path), { method: "POST", body, headers: { "Content-Type": type }, cache: "no-store" }).then((r) => {
    if (r.status === 409) takenOver();
    return r;
  });
}
function report() {
  const track = stream && stream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  $("torch").disabled = !caps.torch;
  if (!online) return;
  post("/state", JSON.stringify({
    type: "state", camera: !!stream, width: video.videoWidth, height: video.videoHeight, facing: cfg.facing, torch: !!caps.torch,
  }), "application/json").catch(() => {});
}
function sendError(text) {
  if (online) post("/state", JSON.stringify({ type: "error", text }), "application/json").catch(() => {});
}

// A page opened later (another tab or phone) took over the PC.
function takenOver() {
  if (replaced) return;
  replaced = true; online = false; sending = false;
  setState(t("offline"));
  $("taken").classList.remove("hidden");
}
$("retake").onclick = () => {
  replaced = false; hello = true;
  $("taken").classList.add("hidden");
  paintState();
};

// Commands from the PC arrive through a long poll.
async function pollLoop() {
  for (;;) {
    if (replaced) { await sleep(400); continue; }
    try {
      const r = await fetch(url("/poll", hello ? "&hello=1" : ""), { cache: "no-store" });
      if (r.status === 409) { takenOver(); continue; }
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const cmds = await r.json();
      hello = false;
      if (!online) { online = true; paintState(); report(); }
      for (const m of cmds) await command(m);
    } catch {
      online = false; sending = false;
      paintState();
      await sleep(1500);
    }
  }
}

async function command(m) {
  if (m.cmd === "start") {
    const restart = !stream || m.facing !== cfg.facing || m.width !== cfg.width || m.height !== cfg.height || m.fps !== cfg.fps;
    Object.assign(cfg, m);
    wanted = true;
    if (restart) await openCamera();
    await setTorch(cfg.torch);
    sending = !!stream;
    if (sending) keepAwake();
    paintState();
  } else if (m.cmd === "stop") {
    wanted = false; sending = false;
    paintState();
  }
}

async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    sendError(t("nocam"));
    return;
  }
  if (stream) stream.getTracks().forEach((tr) => tr.stop());
  stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: cfg.facing === "back" ? "environment" : "user", width: { ideal: cfg.width }, height: { ideal: cfg.height }, frameRate: { ideal: cfg.fps } },
    });
  } catch (err) {
    const text = err.name === "NotAllowedError" ? (wanted ? t("tap") : t("denied"))
      : err.name === "NotReadableError" ? t("busy") : String(err.message || err);
    sendError(text);
    setState(text);
    return;
  }
  stream.getVideoTracks()[0].onended = () => { if (document.visibilityState === "visible") openCamera(); };
  video.srcObject = stream;
  video.classList.toggle("mirror", cfg.facing !== "back");
  await video.play().catch(() => {});
  $("intro").classList.add("hidden");
  $("go").textContent = t("stop");
  $("go").classList.remove("primary");
  sending = wanted && online;
  paintState();
  report();
}

async function setTorch(on) {
  const track = stream && stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities || !track.getCapabilities().torch) return;
  try { await track.applyConstraints({ advanced: [{ torch: !!on }] }); } catch {}
}

async function keepAwake() {
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.onrelease = () => (wake = null); } } catch {}
}

// Frame pump: JPEG uploads, at most two in flight; frames are skipped while the network lags.
function pump() {
  const delay = 1000 / Math.max(1, cfg.fps);
  if (!sending || !stream || !online || !video.videoWidth || inflight >= 2) return void setTimeout(pump, Math.max(8, delay / 2));
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(1, Math.max(cfg.width, cfg.height) / Math.max(vw, vh));
  const w = Math.round(vw * scale) & ~1, h = Math.round(vh * scale) & ~1;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; report(); }
  ctx.drawImage(video, 0, 0, w, h);
  const started = performance.now();
  canvas.toBlob((blob) => {
    if (blob && sending && online) {
      inflight++;
      post("/frame", blob, "image/jpeg").catch(() => {}).finally(() => inflight--);
      frames++; bytes += blob.size;
    }
    const now = performance.now();
    if (now - lastStat > 1000) {
      $("stats").textContent = sending
        ? `${w}×${h} · ${Math.round(frames * 1000 / (now - lastStat))} fps · ${(bytes * 8 / 1e6 / ((now - lastStat) / 1000)).toFixed(1)} Mbit/s`
        : "";
      frames = 0; bytes = 0; lastStat = now;
    }
    setTimeout(pump, Math.max(0, delay - (now - started)));
  }, "image/jpeg", cfg.quality);
}

$("go").onclick = async () => {
  if (stream) {
    stream.getTracks().forEach((tr) => tr.stop());
    stream = null; sending = false;
    video.srcObject = null;
    $("go").textContent = t("allow");
    $("go").classList.add("primary");
    $("intro").classList.remove("hidden");
    paintState();
    report();
    return;
  }
  await openCamera();
};
$("flip").onclick = async () => { cfg.facing = cfg.facing === "back" ? "front" : "back"; if (stream) await openCamera(); report(); };
$("torch").onclick = async () => { cfg.torch = !cfg.torch; await setTorch(cfg.torch); };
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  // iOS stops the camera in the background: resume when the page is shown again.
  if (stream && stream.getVideoTracks()[0]?.readyState === "ended") await openCamera();
  if (sending) keepAwake();
});

if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  $("introHint").textContent = t("nocam");
  $("go").disabled = true;
}
paintState();
pollLoop();
pump();
</script>
</body>
</html>
